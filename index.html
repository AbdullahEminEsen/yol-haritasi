<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geliştirici Saha Kılavuzu — Z3 Stajyer Yol Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#052E41;        /* kurumsal lacivert */
    --ink-2:#0a3a52;
    --ink-3:#0e485f;
    --red:#BB2235;        /* kurumsal kırmızı */
    --red-dk:#961726;
    --green:#1f9d6b;      /* sadece "tamamlandı" durumu için */
    --paper:#F5F6F8;
    --card:#ffffff;
    --text:#15242c;
    --muted:#5c6b74;
    --line:#e4e8eb;
    --line-2:#eef1f3;
    --code-bg:#07222e;
    --code-line:#0f3546;
    --shadow:0 1px 2px rgba(5,46,65,.06),0 8px 24px rgba(5,46,65,.06);
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --sb:320px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;font-family:var(--body);color:var(--text);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.6;
  }
  a{color:inherit}
  ::selection{background:rgba(187,34,53,.16)}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:var(--sb);height:100vh;
    background:var(--ink);color:#dce6ec;display:flex;flex-direction:column;
    border-right:1px solid rgba(255,255,255,.06);z-index:40;
  }
  .brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
  .brand-tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--red);font-weight:700;margin:0 0 8px;
  }
  .brand h1{
    font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.1;margin:0;color:#fff;
    letter-spacing:-.01em;
  }
  .brand p{font-size:12.5px;color:#8ea4b0;margin:7px 0 0}

  .progress-wrap{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.07)}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .progress-top .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7c93a0}
  .progress-top .pct{font-family:var(--disp);font-weight:700;font-size:17px;color:#fff}
  .bar{height:7px;border-radius:20px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#33c088);border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .progress-meta{font-size:11.5px;color:#7c93a0;margin-top:8px;font-family:var(--mono)}

  .nav{flex:1;overflow-y:auto;padding:10px 0 30px}
  .nav::-webkit-scrollbar{width:8px}
  .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
  .phase{margin:2px 0}
  .phase-head{
    display:flex;align-items:center;gap:11px;padding:11px 22px 7px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#89a0ad;
  }
  .phase-head .pn{
    font-weight:700;color:var(--ink);background:#7f97a4;min-width:22px;height:20px;border-radius:5px;
    display:grid;place-items:center;font-size:11px;
  }
  .phase.done .phase-head .pn{background:var(--green);color:#042}
  .topic{
    position:relative;display:flex;align-items:flex-start;gap:11px;
    padding:7px 22px 7px 55px;cursor:pointer;font-size:13.5px;color:#b9cad3;
    text-decoration:none;border-left:2px solid transparent;transition:background .15s,color .15s;
  }
  .topic:hover{background:rgba(255,255,255,.04);color:#fff}
  .topic .dot{
    position:absolute;left:34px;top:12px;width:9px;height:9px;border-radius:50%;
    border:2px solid #587585;background:transparent;transition:all .2s;
  }
  /* omurga çizgisi */
  .topic::before{content:"";position:absolute;left:38px;top:-6px;bottom:-6px;width:2px;background:rgba(255,255,255,.08)}
  .topic:first-of-type::before{top:12px}
  .topic:last-of-type::before{bottom:calc(100% - 12px)}
  .topic.done .dot{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(31,157,107,.2)}
  .topic.active{background:rgba(187,34,53,.14);color:#fff;border-left-color:var(--red)}
  .topic.active .dot{border-color:var(--red)}
  .topic.active.done .dot{border-color:var(--green)}
  .topic .tt{line-height:1.35}

  .sb-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6f8794;font-family:var(--mono)}
  .sb-foot button{
    background:none;border:1px solid rgba(255,255,255,.14);color:#9fb4bf;font-family:var(--mono);
    font-size:10.5px;padding:6px 10px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:.15s;
  }
  .sb-foot button:hover{border-color:var(--red);color:#fff}

  /* plan nav-linki */
  .plan-nav-link{display:flex;align-items:center;gap:10px;padding:11px 22px;margin:8px 0 2px;font-family:var(--mono);font-size:12.5px;color:#cfe0e8;text-decoration:none;border-left:2px solid transparent;border-bottom:1px solid rgba(255,255,255,.07);transition:.15s}
  .plan-nav-link:hover{background:rgba(255,255,255,.05);color:#fff}
  .plan-nav-link.active{background:rgba(187,34,53,.14);color:#fff;border-left-color:var(--red)}
  .pnl-ico{font-size:14px}

  /* ---------- MAIN ---------- */
  .main{margin-left:var(--sb);min-height:100vh;padding:0}
  .content{max-width:820px;margin:0 auto;padding:54px 40px 120px}

  .crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .crumb .ph{color:var(--red);font-weight:700}
  .crumb .sep{color:var(--line)}

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  h2.title{font-family:var(--disp);font-weight:800;font-size:38px;line-height:1.08;letter-spacing:-.02em;margin:0 0 18px;color:var(--ink)}
  @media(max-width:520px){h2.title{font-size:30px}}

  .why{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);
    border-radius:12px;padding:16px 18px;margin:0 0 30px;box-shadow:var(--shadow);
  }
  .why .why-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
  .why p{margin:0;font-size:14.5px;color:var(--text)}

  .body p{font-size:15.5px;margin:0 0 16px}
  .body h3{font-family:var(--disp);font-weight:700;font-size:20px;color:var(--ink);margin:34px 0 12px;letter-spacing:-.01em}
  .body ul{margin:0 0 18px;padding-left:0;list-style:none}
  .body ul li{position:relative;padding-left:24px;margin-bottom:9px;font-size:15px}
  .body ul li::before{content:"";position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--red);transform:rotate(45deg)}
  .body code:not(pre code){font-family:var(--mono);font-size:.86em;background:#eef1f3;color:var(--red-dk);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
  .body strong{font-weight:600;color:var(--ink)}
  .body a{color:var(--red-dk);text-decoration:underline;text-decoration-color:rgba(187,34,53,.3);text-underline-offset:2px}
  .body a:hover{text-decoration-color:var(--red)}

  /* kod bloğu */
  .code{margin:18px 0 22px;border-radius:12px;overflow:hidden;border:1px solid var(--code-line);box-shadow:var(--shadow)}
  .code-head{display:flex;align-items:center;justify-content:space-between;background:var(--code-line);padding:8px 14px}
  .code-head .fn{font-family:var(--mono);font-size:12px;color:#9fc4d6;letter-spacing:.02em}
  .code-head .cp{background:none;border:none;color:#cfe4ee;font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;transition:.15s}
  .code-head .cp:hover{background:rgba(255,255,255,.1);color:#fff}
  .code pre{margin:0;background:var(--code-bg);padding:16px 18px;overflow-x:auto}
  .code code{font-family:var(--mono);font-size:13px;line-height:1.65;color:#d7e6ee;white-space:pre;display:block}
  .code pre::-webkit-scrollbar{height:9px}
  .code pre::-webkit-scrollbar-thumb{background:#1c4a5e;border-radius:8px}
  .tok-c{color:#5f8496;font-style:italic} /* yorum */
  .tok-k{color:#f3839a} /* keyword */
  .tok-s{color:#8fd6a9} /* string */
  .tok-v{color:#7ec7e8} /* variable */
  .tok-f{color:#e6c07b} /* function/method */

  /* adımlar */
  .steps{counter-reset:st;margin:8px 0 24px;padding:0;list-style:none}
  .steps li{counter-increment:st;position:relative;padding:14px 16px 14px 56px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:14.5px;box-shadow:var(--shadow)}
  .steps li::before{content:counter(st,decimal-leading-zero);position:absolute;left:14px;top:13px;font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;background:var(--ink);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}

  .resources{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
  .resources a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 15px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;transition:.15s;box-shadow:var(--shadow)}
  .resources a:hover{border-color:var(--red);transform:translateX(3px)}
  .resources a .arw{margin-left:auto;color:var(--muted);font-family:var(--mono);transition:.15s}
  .resources a:hover .arw{color:var(--red);transform:translateX(3px)}
  .resources a .rt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--line-2);padding:3px 7px;border-radius:5px;font-weight:700}

  .sec-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:40px 0 4px;display:flex;align-items:center;gap:10px}
  .sec-lbl::after{content:"";flex:1;height:1px;background:var(--line)}

  /* tamamla + navigasyon */
  .complete{
    margin:44px 0 0;background:var(--ink);border-radius:14px;padding:22px 24px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow);
  }
  .complete .ctxt{max-width:60%}
  .complete .ctxt b{font-family:var(--disp);font-size:16px;display:block;margin-bottom:2px}
  .complete .ctxt span{font-size:13px;color:#9fb4bf}
  .btn-done{
    display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;border:none;
    font-family:var(--body);font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:10px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .btn-done:hover{background:var(--red-dk)}
  .btn-done.is-done{background:var(--green)}
  .btn-done.is-done:hover{background:#1a8a5d}
  .btn-done .chk{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-size:11px}
  .btn-done.is-done .chk{background:#fff;color:var(--green);border-color:#fff}

  .pager{display:flex;justify-content:space-between;gap:14px;margin-top:40px;flex-wrap:wrap}
  .pager a{flex:1;min-width:220px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:15px 18px;background:var(--card);transition:.15s;box-shadow:var(--shadow)}
  .pager a:hover{border-color:var(--red)}
  .pager .pg-dir{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .pager .pg-title{font-weight:600;color:var(--ink);font-size:14.5px}
  .pager a.next{text-align:right}
  .pager a.disabled{opacity:.4;pointer-events:none}

  /* CHECKPOINT (faz sonu, opsiyonel) */
  .checkpoint{margin:24px 0 0;border:1px solid var(--line);border-left:3px solid var(--red);background:linear-gradient(180deg,rgba(187,34,53,.045),rgba(187,34,53,0));border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
  .cp-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .cp-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
  .cp-opt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--line-2);border:1px solid var(--line);padding:3px 9px;border-radius:20px}
  .cp-body b{font-family:var(--disp);font-size:16px;color:var(--ink);display:block;margin-bottom:5px}
  .cp-body p{margin:0 0 15px;font-size:14px;color:var(--text)}
  .cp-body p code{font-family:var(--mono);font-size:.85em;background:#eef1f3;color:var(--red-dk);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
  .cp-btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 18px;border-radius:10px;transition:.18s}
  .cp-btn:hover{background:var(--red-dk)}
  .cp-btn-off{display:inline-flex;align-items:center;gap:8px;background:var(--line-2);color:var(--muted);font-family:var(--mono);font-size:12px;padding:11px 16px;border-radius:10px;cursor:default}

  /* HERO (giriş sayfası) */
  .hero .eyebrow{color:var(--red)}
  .hero h2.title{font-size:46px;margin-bottom:20px}
  @media(max-width:520px){.hero h2.title{font-size:34px}}
  .hero-lead{font-size:18px;color:var(--text);max-width:640px;margin-bottom:28px}
  .hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:34px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--red);line-height:1}
  .stat .l{font-size:13px;color:var(--muted);margin-top:6px}
  .hero-note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:12px;padding:18px 20px;font-size:14.5px;box-shadow:var(--shadow)}
  .hero-note b{font-family:var(--disp)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{font-family:var(--mono);font-size:12px;background:var(--line-2);border:1px solid var(--line);color:var(--ink);padding:5px 11px;border-radius:20px}
  .start-btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font-weight:600;text-decoration:none;padding:14px 24px;border-radius:11px;font-size:15px;transition:.18s}
  .start-btn:hover{background:var(--red-dk)}
  .hero-cta{margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .restart-link{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line);transition:.15s}
  .restart-link:hover{color:var(--red);border-color:var(--red)}
  .hero-plan-link{display:inline-block;margin-top:18px;font-family:var(--mono);font-size:12.5px;color:var(--red-dk);text-decoration:none;border-bottom:1px dashed rgba(187,34,53,.4)}
  .hero-plan-link:hover{border-color:var(--red-dk)}

  /* PLAN sayfası */
  .plan-picker{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 30px}
  .plan-chip{font-family:var(--mono);font-size:13px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .plan-chip:hover{border-color:var(--red)}
  .plan-chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .plan-week{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .pw-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .pw-num{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink)}
  .pw-count{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .pw-topics{display:flex;flex-wrap:wrap;gap:8px}
  .plan-topic{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);text-decoration:none;background:var(--line-2);border:1px solid var(--line);padding:6px 11px;border-radius:20px;transition:.15s}
  .plan-topic:hover{border-color:var(--red)}
  .pt-dot{width:7px;height:7px;border-radius:50%;border:2px solid #b7c2c8;background:transparent;flex:none}
  .plan-topic.done{background:rgba(31,157,107,.08);border-color:rgba(31,157,107,.3)}
  .plan-topic.done .pt-dot{background:var(--green);border-color:var(--green)}

  /* mobil */
  .topbar{display:none}
  .scrim{display:none}
  @media(max-width:960px){
    :root{--sb:290px}
    .sidebar{transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:20px 0 60px rgba(0,0,0,.3)}
    body.nav-open .sidebar{transform:translateX(0)}
    .main{margin-left:0}
    .topbar{display:flex;position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
    .topbar button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;display:grid;place-items:center}
    .topbar .tb-title{font-family:var(--disp);font-weight:700;font-size:15px}
    .topbar .tb-pct{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--red);font-weight:700}
    .content{padding:32px 22px 100px}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,46,65,.5);z-index:35}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="scrim" onclick="closeNav()"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <p class="brand-tag">Z3 Yazılım · Geliştirici Kılavuzu</p>
    <h1>Stajyer Yol Haritası</h1>
    <p>Sıfırdan üretime: PHP · Laravel · Homestead</p>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="lbl">İlerleme</span>
      <span class="pct" id="pct">%0</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="progress-meta" id="pmeta">0 / 0 konu tamamlandı</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sb-foot">
    <button onclick="resetProgress()">↺ İlerlemeyi sıfırla</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button onclick="openNav()" aria-label="Menü">☰</button>
    <span class="tb-title">Yol Haritası</span>
    <span class="tb-pct" id="tbpct">%0</span>
  </div>
  <div class="content" id="content"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
